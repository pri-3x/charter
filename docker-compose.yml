services:
  postgres:
    image: postgres:16
    container_name: charter-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: charter
    ports:
      # Host port is configurable because it is genuinely contended: 5432 is usually a local
      # Homebrew Postgres, and 5433 tends to be taken by whatever other project got there first.
      # Set CHARTER_PG_PORT in .env to move it; the default stays 5433.
      - "${CHARTER_PG_PORT:-5433}:5432"
    volumes:
      - charter-pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d charter"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  charter-pgdata:
